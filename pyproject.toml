[tool.poetry]
name = "LEXI-GUI"
version = "0.2.3"
description = "GUI for LEXI data visualization"
authors = ["Ramiz A. Qudsi <qudsira@bu.edu>"]

[tool.poetry.dependencies]
python = ">=3.9, <3.11"
seaborn = "^0.11.2"
tabulate = "^0.8.9"
pyinstaller = "^5.1"
tk = "^0.1.0"
Wand = "^0.6.10"
spacepy = "^0.7.0"
bokeh = "^3.1.0"
paramiko = "^3.1.0"
plotly = "^5.24.1"
dash = "^2.18.2"
watchdog = "^6.0.0"
pandas = "^2.2.3"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
